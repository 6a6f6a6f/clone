name: Validate migration locally mirrored checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: ${{ false }} # Migration freeze; repository Actions is also disabled.
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: python3 scripts/check_sdk.py
      - run: make check
      - run: python3 scripts/test_release.py
      - run: python3 scripts/homebrew.py prepare --version 0.2.0 --development
      - run: dotnet list Clone.Tests/Clone.Tests.csproj package --vulnerable --include-transitive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-osx-arm64
          path: artifacts/homebrew/
          if-no-files-found: error
