name: Sign and publish validated macOS artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric release version; its existing tag must identify reviewed code
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  acceptance:
    if: ${{ false }} # Migration freeze; do not remove without reviewed acceptance.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_release_gate.py
  package:
    if: ${{ false }} # Defense in depth during the migration freeze.
    needs: acceptance
    environment: release-signing
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: make check
      - run: python3 scripts/test_release.py
      - name: Prepare ephemeral signing credentials
        run: python3 scripts/signing_keychain.py setup
        env:
          APPLE_APP_CERT_BASE64: ${{ secrets.APPLE_APP_CERT_BASE64 }}
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      - name: Build, sign, notarize and package
        run: python3 scripts/release.py prepare --version "$RELEASE_VERSION" --rid "$RID"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RID: ${{ matrix.rid }}
          CLONE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
          CLONE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/release/**/*.tar.gz
            artifacts/release/**/*.pkg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ matrix.rid }}
          path: artifacts/release/
          if-no-files-found: error
      - name: Remove signing material
        if: ${{ always() }}
        run: python3 scripts/signing_keychain.py cleanup
  publish:
    if: ${{ false }} # Migration freeze; publication remains explicitly blocked.
    needs: package
    environment: release-publishing
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-*
          path: artifacts/downloads
      - name: Verify attestations and publish complete draft
        shell: bash
        run: |
          python3 scripts/publish_release.py \
            "artifacts/downloads/signed-osx-arm64/$RELEASE_VERSION/osx-arm64/manifest.json" \
            "artifacts/downloads/signed-osx-x64/$RELEASE_VERSION/osx-x64/manifest.json"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Propose verified Homebrew metadata
        run: |
          python3 scripts/propose_tap_update.py \
            "artifacts/downloads/signed-osx-arm64/$RELEASE_VERSION/osx-arm64/manifest.json" \
            "artifacts/downloads/signed-osx-x64/$RELEASE_VERSION/osx-x64/manifest.json"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
