name: Publish validated Apple Silicon Homebrew bottles
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric release version; its existing tag must identify reviewed code
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref_type == 'tag' && github.ref_name == format('v{0}', inputs.version)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_release_gate.py
  package:
    needs: acceptance
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: make check
      - run: python3 scripts/test_release.py
      - name: Build source and Homebrew bottle
        run: python3 scripts/homebrew.py prepare --version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/homebrew/**/*.tar.gz
            artifacts/homebrew/**/clone.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-osx-arm64
          path: artifacts/homebrew/
          if-no-files-found: error
  publish:
    needs: package
    environment: release-publishing
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: homebrew-*
          path: artifacts/downloads
      - name: Verify attestations and publish complete draft
        shell: bash
        run: |
          python3 scripts/publish_release.py \
            "artifacts/downloads/homebrew-osx-arm64/$RELEASE_VERSION/arm64_tahoe/manifest.json"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Record Homebrew promotion handoff
        run: |
          echo 'Release published. A maintainer must run scripts/propose_tap_update.py with the verified manifest and review the resulting formula PR.' >> "$GITHUB_STEP_SUMMARY"
