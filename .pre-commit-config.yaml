repos:
  - repo: local
    hooks:
      - id: dotnet-format
        name: Format dotnet files
        entry: dotnet format
        language: system
        pass_filenames: false
        always_run: true
        args: [
          './Clone.sln',
          '--severity', 'error',
          '--verbosity', 'normal'
        ]
        stages: [pre-commit]
